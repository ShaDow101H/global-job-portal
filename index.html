<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Job Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">

    <nav class="border-b border-slate-800 p-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">GLOBAL PORTAL</h1>
            <input type="text" id="searchInput" placeholder="İş axtar..." 
                   class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 w-64 focus:outline-none focus:border-blue-500">
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6">
        <header class="py-12 text-center">
            <h2 class="text-5xl font-extrabold mb-4">Find Your Dream Career</h2>
            <p class="text-slate-400 text-lg">Real-time opportunities at your fingertips.</p>
        </header>

        <div id="loading" class="text-center py-20 text-blue-500 animate-pulse">Məlumatlar yüklənir...</div>

        <div id="jobGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <script>
        // URL-i düzəltdim: 'wlxeff' silindi, 'wlxff' yazıldı, link işarələri təmizləndi
        const SUPABASE_URL = 'https://uqpntwlxeffatcmcpejs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ls4nLsyQCPjJV5dGfC_XKA_cCkEqMWH';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let allJobs = []; 

        async function fetchJobs() {
            try {
                const { data, error } = await supabase
                    .from('internships')
                    .select('*');

                if (error) throw error;

                allJobs = data;
                renderJobs(allJobs);
                document.getElementById('loading').classList.add('hidden');
            } catch (err) {
                console.error("Xəta:", err);
                document.getElementById('loading').innerHTML = `Xəta baş verdi: ${err.message}`;
            }
        }

        function renderJobs(jobs) {
            const grid = document.getElementById('jobGrid');
            if (!jobs || jobs.length === 0) {
                grid.innerHTML = '<p class="text-center col-span-full text-slate-500">Heç bir elan tapılmadı.</p>';
                return;
            }
            grid.innerHTML = jobs.map(job => `
                <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 hover:border-blue-500 transition-all group">
                    <h3 class="text-xl font-bold mb-2 group-hover:text-blue-400">${job.title || 'Adsız'}</h3>
                    <p class="text-slate-400 mb-4">${job.company || 'Şirkət adı'}</p>
                    <div class="flex justify-between items-center">
                        <span class="text-xs bg-slate-800 px-3 py-1 rounded-full text-blue-300">${job.type || 'Full-time'}</span>
                        <a href="#" class="text-sm font-semibold text-blue-500 hover:underline">Apply →</a>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allJobs.filter(job => 
                (job.title && job.title.toLowerCase().includes(term)) || 
                (job.company && job.company.toLowerCase().includes(term))
            );
            renderJobs(filtered);
        });

        fetchJobs();
    </script>
</body>
</html>
