<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Internship & Job Portal</title>
    <!-- Tailwind CSS (Dizayn üçün) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase SDK (Bazaya qoşulmaq üçün) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans">

    <!-- Header Section -->
    <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                🎯 GLOBAL PORTAL
            </h1>
            <!-- Navigasiya və Filtrlər -->
            <div class="flex items-center gap-2 bg-slate-900 p-1 rounded-xl border border-slate-800">
                <button onclick="filterData('All')" id="btn-All" class="px-4 py-2 rounded-lg text-sm font-medium transition bg-blue-600 text-white">All</button>
                <button onclick="filterData('Internship')" id="btn-Internship" class="px-4 py-2 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white">Internships</button>
                <button onclick="filterData('Job')" id="btn-Job" class="px-4 py-2 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white">Jobs</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-6 py-12">
        <!-- Hero Section -->
        <div class="text-center mb-12">
            <h2 class="text-4xl md:text-5xl font-black mb-4">Find Your Dream Career Opportunity</h2>
            <p class="text-slate-400 text-lg max-w-2xl mx-auto">Explore active internships and jobs from top global companies. Updated in real-time.</p>
        </div>

        <!-- Search Bar -->
        <div class="max-w-xl mx-auto mb-12">
            <input type="text" id="searchInput" oninput="searchData()" placeholder="Search by job title, company or location..." 
                   class="w-full px-5 py-4 rounded-2xl bg-slate-950 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-lg">
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mx-auto mb-4"></div>
            <p class="text-slate-400">Opportunities are loading from database...</p>
        </div>

        <!-- Cards Grid -->
        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Cards will be injected here by JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-950/20 py-8 text-center text-sm text-slate-500 mt-20">
        <p>© 2026 Global Job Portal. Built with Claude, Supabase & Vercel.</p>
    </footer>

    <!-- JavaScript - Supabase Connection -->
    <script>
        // ⚠️ SUPABASE MƏLUMATLARINI BURA YAZIN!
const SUPABASE_URL = 'https://uqpntwlxffatcmcpejs.supabase.co'; 
const SUPABASE_ANON_KEY = 'sb_publishable_ls4nLsyQCPjJV5dGfC_XKA_cCkEqMWH';
      

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let allData = [];
        let currentFilter = 'All';

        // Verilənləri bazadan çəkmək
        async function loadOpportunities() {
            try {
                const { data, error } = await supabase
                    .from('internships')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allData = data;
                renderCards(allData);
            } catch (err) {
                console.error("Error fetching data:", err);
                document.getElementById('loading').innerHTML = `<p class="text-red-500 font-semibold">Error: Could not load data. Check console.</p>`;
            }
        }

        // Kartları ekrana yazdırmaq
        function renderCards(items) {
            const container = document.getElementById('cards-container');
            const loading = document.getElementById('loading');
            
            container.innerHTML = '';
            loading.classList.add('hidden');
            container.classList.remove('hidden');

            if(items.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No opportunities found matching your criteria.</div>`;
                return;
            }

            items.forEach(item => {
                const badgeColor = item.type === 'Job' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-blue-500/10 text-blue-400 border-blue-500/20';
                
                const card = `
                    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 hover:border-slate-700 transition duration-300 shadow-xl flex flex-col justify-between h-[320px]">
                        <div>
                            <div class="flex justify-between items-start gap-2 mb-4">
                                <span class="px-3 py-1 rounded-full text-xs font-semibold border ${badgeColor}">
                                    ${item.type || 'Internship'}
                                </span>
                                <span class="text-xs text-slate-500">Deadline: ${item.deadline || 'N/A'}</span>
                            </div>
                            <h3 class="text-xl font-bold text-white mb-1 line-clamp-2">${item.title}</h3>
                            <p class="text-blue-400 font-medium text-sm mb-3">${item.company}</p>
                            <p class="text-slate-400 text-sm line-clamp-3 mb-4">${item.description || 'No description provided.'}</p>
                        </div>
                        <div class="flex justify-between items-center pt-4 border-t border-slate-900">
                            <span class="text-slate-500 text-xs flex items-center gap-1">
                                📍 ${item.location}
                            </span>
                            <a href="${item.apply_link}" target="_blank" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-sm font-semibold rounded-xl transition">
                                Apply
                            </a>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', card);
            });
        }

        // Süzgəcləmə (Filter)
        function filterData(type) {
            currentFilter = type;
            
            // Düymə dizaynlarını yeniləmək
            ['All', 'Internship', 'Job'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if (t === type) {
                    btn.className = "px-4 py-2 rounded-lg text-sm font-medium transition bg-blue-600 text-white";
                } else {
                    btn.className = "px-4 py-2 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white";
                }
            });

            applyFilters();
        }

        // Axtarış
        function searchData() {
            applyFilters();
        }

        // Həm axtarış, həm də süzgəci eyni anda tətbiq etmək
        function applyFilters() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allData;

            if (currentFilter !== 'All') {
                filtered = filtered.filter(item => item.type === currentFilter);
            }

            if (searchQuery) {
                filtered = filtered.filter(item => 
                    item.title.toLowerCase().includes(searchQuery) ||
                    item.company.toLowerCase().includes(searchQuery) ||
                    item.location.toLowerCase().includes(searchQuery)
                );
            }

            renderCards(filtered);
        }

        // Səhifə yüklənəndə datanı gətir
        window.onload = loadOpportunities;
    </script>
</body>
</html>
